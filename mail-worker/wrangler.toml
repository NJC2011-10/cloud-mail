name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "22a0bf21-3155-4fbc-b45b-0af64fab4701"

[[kv_namespaces]]
binding = "kv"
id = "0eecadee640647cd846623c785e103d2"

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

admin = "admin@mail.njc2025.de5.net"
domain = '["njc123.dpdns.org", "inbox.njc123.dpdns.org", "mail.njc123.dpdns.org", "njc123.qzz.io", "inbox.njc123.qzz.io", "mail.njc123.qzz.io", "njc137.dpdns.org", "inbox.njc137.dpdns.org", "mail.njc137.dpdns.org", "njc137.qzz.io", "inbox.njc137.qzz.io", "mail.njc137.qzz.io", "njc2025.de5.net", "inbox.njc2025.de5.net", "mail.njc2025.de5.net", "njc2025.dpdns.org", "inbox.njc2025.dpdns.org", "mail.njc2025.dpdns.org", "email.njc2025.dpdns.org", "njc.qzz.io", "inbox.njc.qzz.io", "mail.njc.qzz.io"]'

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
